<title>Nova Logic — نوفالوجك (Copy)</title>

<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=block" rel="stylesheet">
<style>
:root{--orange:#FF8B00;--amber:#FEB50A;--yellow:#FFD412;--gray:#686868;--bg:#F5EFE6;--card:#FFFBF5;--ink:#2B3A4F;--mut:#686868;--line:#EBDDCB;--grad:linear-gradient(120deg,#FF8B00,#FEB50A 60%,#FFD412);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1d1f;--card:#2a2a2d;--ink:#f3ece1;--mut:#b5b0a8;--line:#3a3a3e}}
:root[data-theme="dark"]{--bg:#1d1d1f;--card:#2a2a2d;--ink:#f3ece1;--mut:#b5b0a8;--line:#3a3a3e}
*{box-sizing:border-box;margin:0}html{scroll-behavior:smooth;scroll-padding-top:80px;scrollbar-gutter:stable}
body{background:var(--bg);color:var(--ink);font-family:'Tajawal',Tahoma,Arial,sans-serif;line-height:1.9;font-size:17px;overflow-x:hidden}
.w{max-width:1080px;margin:auto;padding:0 20px;position:relative}
/* intro */
.sp{position:fixed;inset:0;z-index:99;background:radial-gradient(circle at 50% 45%,#fff 0,#fbf7f0 45%,#F5EFE6 100%);display:grid;place-items:center;overflow:hidden;cursor:pointer;transition:opacity 1.5s cubic-bezier(.45,0,.25,1),visibility 0s 1.5s}
.sp.out{opacity:0;visibility:hidden}
.zoom{--s:min(440px,82vw);position:relative;width:var(--s);height:var(--s);animation:zIn 1.6s cubic-bezier(.25,.6,.3,1) both;transition:transform 1.5s cubic-bezier(.45,0,.25,1),filter 1.5s ease}
@keyframes zIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
.sp.out .zoom{transform:scale(1.14);filter:blur(8px)}
.rg{position:absolute;border-radius:50%;opacity:0;-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 3px));mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 3px))}
.r1{inset:0;background:conic-gradient(from 0deg,transparent 0 55%,#FF8B00 80%,#FFD412 100%)}
.r2{inset:11%;background:conic-gradient(from 180deg,transparent 0 60%,#FEB50A 85%,#FF8B00 100%)}
.r3{inset:-6%;background:conic-gradient(from 90deg,transparent 0 70%,#686868 100%);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 2px),#000 calc(100% - 2px));mask:radial-gradient(farthest-side,transparent calc(100% - 2px),#000 calc(100% - 2px))}
.p1 .rg{animation:rgIn 1.7s cubic-bezier(.2,.8,.2,1) forwards,spin 5s linear infinite}
.p1 .r2{animation:rgIn 1.7s .3s cubic-bezier(.2,.8,.2,1) forwards,spin 4s linear infinite reverse}
.p1 .r3{animation:rgIn 1.7s .6s cubic-bezier(.2,.8,.2,1) forwards,spin 8s linear infinite}
@keyframes rgIn{from{opacity:0;scale:.3}to{opacity:.95;scale:1}}
@keyframes spin{to{transform:rotate(360deg)}}
.glo{position:absolute;inset:14%;border-radius:50%;background:radial-gradient(circle,#ffb54a70,transparent 66%);opacity:0;transform:scale(.4)}
.p1 .glo{animation:glo 2.2s ease-out forwards}.p3 .glo{animation:burst 1.6s ease-in-out forwards}
@keyframes glo{to{opacity:.9;transform:scale(1)}}@keyframes burst{0%{opacity:.9;transform:scale(1)}50%{opacity:1;transform:scale(1.5)}100%{opacity:.6;transform:scale(1.15)}}
.pa{position:absolute;left:50%;top:50%;border-radius:50%;opacity:0}
.p1 .pa{animation:conv 1.9s cubic-bezier(.5,0,.2,1) forwards;animation-delay:calc(var(--d)*1.7)}
@keyframes conv{0%{transform:translate(var(--x),var(--y)) scale(1);opacity:0}20%{opacity:1}100%{transform:translate(0,0) scale(.2);opacity:0}}
.stage{position:absolute;left:50%;top:50%;width:64%;transform:translate(-50%,-50%)}
.tilt{transition:transform .25s ease-out;transform-style:preserve-3d}
.tilt img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}
.em{opacity:0}.p1 .em{animation:emIn 1.9s cubic-bezier(.2,.9,.25,1.05) .5s forwards}.p3 .em{animation:none;opacity:1;filter:drop-shadow(0 0 0 #ff8b00);animation:glw2 1.7s ease-in-out}
@keyframes emIn{from{opacity:0;transform:scale(.3) rotate(-28deg);filter:blur(14px)}60%{filter:blur(0)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes glw2{40%{filter:drop-shadow(0 0 18px #ff8b00aa)}}
.wmw{margin-top:-1px;clip-path:inset(0 100% 0 0)}.p2 .wmw,.p3 .wmw{animation:wipe 1.6s cubic-bezier(.45,0,.2,1) forwards}
@keyframes wipe{to{clip-path:inset(0 0 0 0)}}
@media(prefers-reduced-motion:reduce){.sp .em{opacity:1!important}.sp .wmw{clip-path:none!important}}
body:not(.ready){overflow:hidden}
body:not(.ready) header,body:not(.ready) main,body:not(.ready) footer{opacity:0}
body:not(.ready) .bgl,body:not(.ready) .pl,body:not(.ready) .glow,body:not(.ready) .bar{visibility:hidden}
header,main,footer{transition:opacity 1.4s ease .5s}
.ready .hero h1{animation:up 1.2s .5s backwards}.ready .hero p{animation:up 1.2s .75s backwards}.ready .hero .btn{animation:up 1.2s 1s backwards}

main,header,footer{position:relative;z-index:1}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
nav{display:flex;align-items:center;justify-content:space-between;height:68px}
nav .lg{background:#fff;border-radius:12px;padding:3px 10px;display:flex}nav .lg img{height:42px}
nav ul{display:flex;gap:6px;list-style:none;padding:0}
nav ul a{color:var(--ink);text-decoration:none;font-weight:700;font-size:15px;padding:6px 12px;border-radius:20px;transition:.25s}
nav ul a:hover,nav ul a.on{background:var(--grad);color:#2b1a00}
.burger{display:none;background:none;border:0;font-size:28px;color:var(--ink);cursor:pointer}
.btn{display:inline-block;background:var(--grad);color:#2b1a00;font-weight:800;padding:12px 28px;border-radius:40px;text-decoration:none;box-shadow:0 6px 18px #ff8b0040;transition:.3s;border:0;font-family:inherit;font-size:16px;cursor:pointer}
.btn:hover{transform:translateY(-3px) scale(1.04);box-shadow:0 12px 26px #ff8b0066}
.btn.o{background:none;border:2px solid var(--orange);color:var(--orange);box-shadow:none}.btn.o:hover{background:var(--orange);color:#fff}
.hero{padding:80px 0 90px;min-height:78vh;display:grid;align-items:center}
.hero h1{font-size:clamp(36px,7vw,68px);line-height:1.25;font-weight:800}
.hero h1 span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--mut);margin:18px 0 28px;max-width:600px}.hero .btn{margin-inline-end:10px;margin-bottom:10px}
.blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.35;animation:fl 9s ease-in-out infinite alternate}
.b1{width:260px;height:260px;background:var(--orange);top:10%;left:-40px}.b3{width:160px;height:160px;background:var(--amber);top:55%;left:45%;animation-delay:-2s}.b2{width:200px;height:200px;background:var(--yellow);bottom:0;right:5%;animation-delay:-4s}
@keyframes fl{to{transform:translate(30px,-40px) scale(1.15)}}
section{padding:68px 0}h2{font-size:34px;font-weight:800}
h2::after{content:"";display:block;width:64px;height:5px;border-radius:5px;background:var(--grad);margin-top:6px;transition:width .8s}
.rv.in h2::after,h2.in::after{width:120px}
.lead{color:var(--mut);margin:16px 0 26px;max-width:780px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}
.c{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px;transition:transform .3s,box-shadow .3s,border-color .3s}
.c:hover{transform:translateY(-8px);box-shadow:0 18px 36px #ff8b0030;border-color:var(--orange)}
.c h3{font-size:20px;margin-bottom:6px}.c p{color:var(--mut);font-size:15px}
.n{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--grad);color:#2b1a00;font-weight:800;margin-bottom:10px;transition:transform .4s}
.c:hover .n{transform:rotate(360deg) scale(1.1)}
.alt{background:color-mix(in srgb,var(--card) 80%,transparent);border-block:1px solid var(--line)}
.goals{list-style:none;padding:0;display:grid;gap:12px}
.goals .gi{padding:10px 48px 10px 14px;position:relative;border-radius:14px;transition:.25s}
.goals .gi:hover{background:var(--card);transform:translateX(-6px)}
.goals .gi::before{content:"✓";position:absolute;inset-inline-start:auto;right:10px;top:12px;width:26px;height:26px;line-height:26px;text-align:center;border-radius:50%;background:var(--grad);color:#2b1a00;font-weight:800;font-size:14px}
.tabs{display:flex;flex-wrap:wrap;gap:10px;margin:22px 0}
.tab{font-family:inherit;font-size:16px;font-weight:700;padding:10px 20px;border-radius:30px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;transition:.25s}
.tab:hover{border-color:var(--orange)}.tab.on{background:var(--grad);border-color:transparent;color:#2b1a00;transform:scale(1.05)}
.sub{color:var(--mut);margin-bottom:16px}
.pane>div{animation:up .55s both}
@keyframes up{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
.cta{background:var(--gray);color:#fff;border-radius:28px;padding:44px;border-bottom:8px solid var(--orange);text-align:center}
.cta h2{color:#fff}.cta h2::after{margin:6px auto 0}.cta p{margin:14px 0 24px;opacity:.9}
.ct{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}.ct .btn{background:#fff;color:var(--gray);box-shadow:none}.ct .btn:first-child{background:var(--grad);color:#2b1a00}
footer{padding:26px 0;text-align:center;color:var(--mut);font-size:14px}
.rv{opacity:0;transform:translateY(34px);transition:opacity .8s ease,transform .8s ease}.rv.in{opacity:1;transform:none}
.bar{position:fixed;top:0;right:0;height:4px;background:var(--grad);z-index:100;width:0}
@media(max-width:760px){.burger{display:block}nav ul{display:none;position:absolute;top:68px;inset-inline:0;background:var(--bg);flex-direction:column;padding:12px 20px;border-bottom:1px solid var(--line)}nav ul.open{display:flex}.cta{padding:30px 18px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}

.pk{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:20px;margin-top:30px;align-items:stretch}
.card{position:relative;background:var(--card);border:2px solid var(--line);border-radius:26px;padding:30px 22px 24px;cursor:pointer;display:flex;flex-direction:column;transition:transform .15s,box-shadow .3s,border-color .3s;will-change:transform}
.card:hover{box-shadow:0 22px 44px #ff8b0038;border-color:var(--amber)}
.card.sel{border-color:var(--orange);box-shadow:0 22px 50px #ff8b0050}
.card.pop{background:linear-gradient(160deg,#FF8B00,#FEB50A 70%,#FFD412);color:#2b1a00;border-color:transparent}
.card.pop .pr small,.card.pop li{color:#2b1a00}.card.pop li::before{background:#fff;color:var(--orange)}
.tag{position:absolute;top:-14px;inset-inline-start:50%;transform:translateX(50%);background:var(--gray);color:#fff;font-size:13px;font-weight:800;padding:3px 16px;border-radius:20px;white-space:nowrap;animation:pulse 2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px #68686822}}
.card h3{font-size:22px}.card .pr{font-size:54px;font-weight:800;line-height:1.2;margin:8px 0 14px}.card .pr small{font-size:18px;color:var(--mut);margin-inline-start:6px}
.card ul{list-style:none;padding:0;flex:1;margin-bottom:20px}
.card li{position:relative;padding-inline-start:26px;margin-bottom:6px;font-size:16px}
.card li::before{content:"✓";position:absolute;inset-inline-start:0;top:3px;width:19px;height:19px;line-height:19px;text-align:center;font-size:11px;font-weight:800;border-radius:50%;background:var(--grad);color:#2b1a00}
.card li em{display:block;font-style:normal;font-size:13px;opacity:.75;line-height:1.5}
.card li b{background:#fff;color:var(--orange);border-radius:12px;padding:0 9px;margin-inline-end:5px;font-weight:800}
.card .btn{text-align:center;width:100%}.card.pop .btn{background:var(--gray);color:#fff;box-shadow:none}
.note{color:var(--mut);font-size:14px;margin-top:22px;text-align:center}
.toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom,0px));left:50%;transform:translate(-50%,40px);background:var(--gray);color:#fff;padding:12px 24px;border-radius:30px;font-weight:700;z-index:120;opacity:0;transition:.4s;border-bottom:4px solid var(--orange);pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
.top{position:fixed;bottom:calc(22px + env(safe-area-inset-bottom,0px));right:20px;z-index:50;width:48px;height:48px;border-radius:50%;border:0;background:var(--grad);color:#2b1a00;font-size:22px;font-weight:800;cursor:pointer;box-shadow:0 8px 20px #ff8b0055;transition:.3s;opacity:0;transform:scale(.5);pointer-events:none}
.top.on{opacity:1;transform:none;pointer-events:auto}.top:hover{transform:translateY(-4px)}
.btn:active,.tab:active,.card:active{transform:scale(.97)}

.bd{display:grid;grid-template-columns:1.3fr 1fr;gap:22px;margin-top:28px;align-items:start}
.opts{display:grid;gap:12px}
.opt{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px 18px;transition:.25s;cursor:pointer}
.opt:hover{border-color:var(--amber);transform:translateX(-4px)}.opt.on{border-color:var(--orange);background:color-mix(in srgb,var(--orange) 9%,var(--card))}
.opt label{display:flex;align-items:center;gap:12px;cursor:pointer;font-weight:700;font-size:18px}
.opt input[type=checkbox]{appearance:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--gray);display:grid;place-items:center;cursor:pointer;transition:.25s;flex:none}
.opt input[type=checkbox]:checked{background:var(--grad);border-color:transparent}.opt input[type=checkbox]:checked::after{content:"✓";color:#2b1a00;font-weight:800;font-size:15px}
.qty{display:flex;align-items:center;gap:10px;margin-top:12px;animation:up .4s both}
.qty span{color:var(--mut);font-size:15px}.qty button{width:34px;height:34px;border-radius:50%;border:0;background:var(--grad);color:#2b1a00;font-size:20px;font-weight:800;cursor:pointer;transition:.2s}.qty button:hover{transform:scale(1.15)}
.qty input{width:84px;text-align:center;font-family:inherit;font-size:18px;font-weight:800;padding:6px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.qty input:focus{outline:none;border-color:var(--orange)}.qty.bad input{border-color:#d33}
.sum{background:var(--card);border:2px solid var(--orange);border-radius:24px;padding:24px;position:sticky;top:90px}
.sum h3{margin-bottom:10px}.sum ul{list-style:none;padding:0;min-height:70px;margin-bottom:16px}
.sum li{padding:6px 0;border-bottom:1px dashed var(--line);animation:up .35s both}.sum li b{color:var(--orange)}
.sum .e{color:var(--mut);border:0}.sum .btn{width:100%;text-align:center}.sum .btn[disabled]{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.sum .cl{background:none;border:0;color:var(--mut);cursor:pointer;font-family:inherit;margin-top:10px;width:100%;transition:.2s}.sum .cl:hover{color:var(--orange)}
@media(max-width:760px){.bd{grid-template-columns:1fr}.sum{position:static}}

.qty{margin-top:14px}.qty .ctl{direction:ltr;display:flex;align-items:center;gap:12px}
.qty input{width:84px;height:44px;-moz-appearance:textfield;appearance:textfield;padding:0 6px}
.qty button{width:44px;height:44px;border-radius:14px;font-size:24px;line-height:1;flex:none}
.qty button:active{transform:scale(.88)}.qty.bad input{border-color:#d33;animation:shk .35s}
@keyframes shk{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.opt{-webkit-tap-highlight-color:transparent;user-select:none}
.opt .row{display:flex;align-items:center;gap:12px;font-weight:700;font-size:18px}
.bx{width:26px;height:26px;border-radius:8px;border:2px solid var(--gray);display:grid;place-items:center;flex:none;transition:.25s;font-size:15px;font-weight:800;color:transparent}
.opt.on .bx{background:var(--grad);border-color:transparent;color:#2b1a00}
.opt:focus-visible{outline:3px solid var(--orange)}

.pl{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.pl i{position:absolute;bottom:-30px;border-radius:50%;opacity:0;animation:rise linear infinite}
@keyframes rise{10%{opacity:.5}90%{opacity:.35}to{transform:translate(var(--dx),-112vh);opacity:0}}
.glow{position:fixed;top:0;left:0;width:360px;height:360px;margin:-180px 0 0 -180px;border-radius:50%;background:radial-gradient(circle,#ff8b0030,transparent 65%);pointer-events:none;z-index:0;will-change:transform}
@media(hover:none){.glow{display:none}}
.fl{position:relative;overflow:hidden;background-color:var(--card);background-image:radial-gradient(280px circle at var(--mx,50%) var(--my,50%),#ff8b0028,transparent 62%);border:2px solid var(--line);border-radius:26px;padding:28px 26px;transition:transform .3s,box-shadow .3s,border-color .3s}
.fl:hover{transform:translateY(-8px);border-color:var(--orange);box-shadow:0 22px 46px #ff8b0033}
.fl::before{content:"";position:absolute;top:0;inset-inline:0;height:6px;background:var(--grad);transform:scaleX(.25);transform-origin:right;transition:transform .5s}
.fl:hover::before{transform:scaleX(1)}
.fl.big{padding:34px 30px}.fl.big h3{font-size:30px}
.fl h3{font-size:22px;margin-bottom:10px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;display:inline-block}
.fl p{color:var(--mut);margin-bottom:12px}.fl .ex{animation:up .5s both}
.fa{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:8px}
.mr{font-family:inherit;font-size:15px;font-weight:800;border-radius:30px;padding:8px 22px;cursor:pointer;transition:.25s;border:2px solid var(--orange);background:var(--orange);color:#2b1a00}.mr:hover{background:var(--amber);border-color:var(--amber);transform:scale(1.06)}.mr:active{transform:scale(.94)}
.vm{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:24px}


.btn.big{font-size:20px;padding:16px 44px;margin-top:6px;animation:glw 2.4s ease-in-out infinite}
.btn.big.shown{animation:none;background:var(--gray);color:#fff;box-shadow:none}
@keyframes glw{50%{box-shadow:0 0 0 12px #ff8b0022,0 10px 28px #ff8b0066}}
.clp{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows .65s cubic-bezier(.2,.8,.2,1),opacity .5s}
.clp>div{overflow:hidden;min-height:0;visibility:hidden;transition:visibility 0s .65s}
.clp.open{grid-template-rows:1fr;opacity:1}.clp.open>div{visibility:visible;transition-delay:0s}
.clp .sum{position:static}

function Splash({out,onOut}){
  const [ph,setPh]=useState(0),[t,setT]=useState({x:0,y:0});
  useEffect(()=>{const ts=[setTimeout(()=>setPh(1),300),setTimeout(()=>setPh(2),1800),setTimeout(()=>setPh(3),3500),setTimeout(onOut,5400)];
    const k=e=>{if(e.key==="Enter"||e.key==="Escape"||e.key===" ")onOut()};addEventListener("keydown",k);
    return()=>{ts.forEach(clearTimeout);removeEventListener("keydown",k)}},[]);
  const mv=e=>{const p=e.touches?e.touches[0]:e;setT({x:p.clientX/innerWidth-.5,y:p.clientY/innerHeight-.5})};
  return html`<div className=${"sp p"+ph+(out?" out":"")} onMouseMove=${mv} onTouchMove=${mv} onClick=${onOut} role="img" aria-label="Nova Logic">
    <div className="zoom">
      <span className="rg r3"></span><span className="rg r1"></span><span className="rg r2"></span><span className="glo"></span>
      ${SPD.map((p,i)=>html`<i key=${i} className="pa" style=${{width:p.z,height:p.z,background:p.c,"--x":p.x,"--y":p.y,"--d":p.d}}></i>`)}
      <div className="stage"><div className="tilt" style=${{transform:"perspective(900px) rotateY("+(t.x*16)+"deg) rotateX("+(-t.y*16)+"deg)"}}>
        <img className="em" src=${LOGO_T} alt=""/><div className="wmw"><img src=${LOGO_B} alt=""/></div></div></div>
    </div></div>`;
}

function Header(){
  const [open,setOpen]=useState(false),[act,setAct]=useState("");
  useEffect(()=>{const f=()=>{let a="";NAV.forEach(([id])=>{const e=document.getElementById(id);if(e&&e.getBoundingClientRect().top<140)a=id});setAct(a)};addEventListener("scroll",f,{passive:true});return()=>removeEventListener("scroll",f)},[]);
  return html`<header><div className="w"><nav>
    <a className="lg" href="#top"><img src=${LOGO} alt="Nova Logic"/></a>
    <ul className=${open?"open":""}>${NAV.map(([id,t])=>html`<li key=${id}><a href=${LINKS[id]||"#"+id} target=${LINKS[id]?"_blank":undefined} rel=${LINKS[id]?"noopener noreferrer":undefined} className=${act===id?"on":""} onClick=${()=>setOpen(false)}>${t}</a></li>`)}</ul>
    <button className="burger" aria-label="القائمة" onClick=${()=>setOpen(!open)}>${open?"✕":"☰"}</button>
  </nav></div></header>`;
}

function useCount(to,on){const [v,setV]=useState(0);useEffect(()=>{if(!on)return;let t0,id;const step=t=>{t0=t0||t;const k=Math.min((t-t0)/1100,1);setV(Math.round(to*(1-Math.pow(1-k,3))));if(k<1)id=requestAnimationFrame(step)};id=requestAnimationFrame(step);return()=>cancelAnimationFrame(id)},[on]);return v}
function Plan({pk,sel,onSel,i}){

  const mv=e=>{const b=r.current.getBoundingClientRect(),x=(e.clientX-b.left)/b.width-.5,y=(e.clientY-b.top)/b.height-.5;r.current.style.transform=`perspective(800px) rotateY(${x*8}deg) rotateX(${-y*8}deg) translateY(-8px)`};
  const lv=()=>{r.current.style.transform=""};
  const lines=pk.f.map(x=>"- "+x[0]+(x[1]?": "+x[1]:"")+(x[2]?" ("+x[2]+")":"")).join("\n");
  const href=waLink("مرحبًا نوفالوجك، أرغب بطلب "+pk.n+" ("+pk.p+" شيكل) وتتضمن:\n"+lines);

function useHoverable(){
  const q="(hover: hover) and (pointer: fine)";
  const get=()=>typeof matchMedia==="function"&&matchMedia(q).matches;
  const [h,setH]=useState(get);
  useEffect(()=>{if(typeof matchMedia!=="function")return;const m=matchMedia(q),f=()=>setH(m.matches);
    m.addEventListener?m.addEventListener("change",f):m.addListener(f);
    return()=>{m.removeEventListener?m.removeEventListener("change",f):m.removeListener(f)}},[]);
  return h;
}
function Feel({id,title,paras,big,fold}){
  const hov=useHoverable(),[open,setOpen]=useState(!fold);
  useEffect(()=>{if(fold)setOpen(false)},[hov]);
  const mv=e=>{const r=e.currentTarget.getBoundingClientRect();e.currentTarget.style.setProperty("--mx",(e.clientX-r.left)+"px");e.currentTarget.style.setProperty("--my",(e.clientY-r.top)+"px")};
  const enter=fold&&hov?()=>setOpen(true):undefined,leave=fold&&hov?()=>setOpen(false):undefined;
  return html`<div className=${"fl"+(big?" big":"")} onMouseMove=${mv} onMouseEnter=${enter} onMouseLeave=${leave}>
    <h3>${title}</h3>
    ${paras.map((p,i)=>(i===0||open)&&html`<p key=${i} className=${i>0?"ex":""}>${p}</p>`)}
    ${fold&&(!hov||!open)&&html`<div className="fa"><button className="mr" onClick=${()=>setOpen(!open)}>${open?"إخفاء":"اقرأ المزيد"}</button></div>`}</div>`;
}

function Particles(){

    const z=4+r(1)*14;return{l:r(2)*100,z,c:PCOL[i%4],d:14+r(3)*18,de:-r(4)*30,dx:(r(5)-.5)*120}}),[]);
  return html`<div className="pl" aria-hidden="true">${dots.map((p,i)=>html`<i key=${i} style=${{left:p.l+"%",width:p.z,height:p.z,background:p.c,animationDuration:p.d+"s",animationDelay:p.de+"s","--dx":p.dx+"px"}}></i>`)}</div>`;
}

  return html`<div className="glow" ref=${r} aria-hidden="true"></div>`;
